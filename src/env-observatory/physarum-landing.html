<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morphogenesis — Physarum Field · decentralized agent swarm</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#physarum { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#note { position: fixed; bottom: 10px; right: 14px; font: 12px/1.4 "JetBrains Mono", monospace; color: #bd9b50; pointer-events: none; }

/* ===== Morphogenesis opening overlay (added on top of the verbatim effect) ===== */
html, body { font-family: "Space Grotesk Variable", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
#physarum-note { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
/* faint readability pool behind the right column — keeps the field dominant */
#physarum-note .shade {
  position: absolute; inset: 0;
  background:
    radial-gradient(46em 34em at 74% 52%, rgba(0, 0, 0, .46), transparent 72%),
    linear-gradient(90deg, transparent 58%, rgba(0, 0, 0, .30) 100%);
}
#physarum-note .hero {
  position: absolute;
  right: clamp(28px, 7vw, 104px);
  top: 50%; transform: translateY(-50%);
  max-width: min(26em, 40vw);
  text-align: left;
}
#physarum-note .hero > * {
  opacity: 0; transform: translateY(12px);
  transition: opacity 1.1s cubic-bezier(.22,.68,.24,1), transform 1.1s cubic-bezier(.22,.68,.24,1);
}
#physarum-note.revealed .hero > * { opacity: 1; transform: none; }
#physarum-note .eyebrow {
  font-size: 10px; letter-spacing: .30em; text-transform: lowercase;
  color: #c9a24a; font-weight: 500;
  transition-delay: .0s;
}
#physarum-note .title {
  margin-top: 12px;
  font-size: clamp(30px, 4.5vw, 56px);
  font-weight: 560; letter-spacing: -.015em; line-height: 1.08;
  color: #efe8d2;
  text-shadow: 0 1px 24px rgba(0, 0, 0, .55);
  transition-delay: .12s;
}
#physarum-note .rule {
  width: 44px; height: 1px; margin: 16px 0 13px;
  background: linear-gradient(90deg, #bd9b50, transparent);
  transition-delay: .26s;
}
#physarum-note .tagline {
  font-size: 12px; letter-spacing: .16em; color: #b3ab94;
  transition-delay: .38s;
}
#physarum-note .enter {
  display: inline-block; margin-top: 20px;
  font-size: 10px; letter-spacing: .20em; color: rgba(189, 155, 80, .55);
  text-decoration: none; pointer-events: auto;
  transition-property: opacity, transform, color;
  transition-duration: 1.1s, 1.1s, .25s;
  transition-timing-function: cubic-bezier(.22,.68,.24,1), cubic-bezier(.22,.68,.24,1), ease;
  transition-delay: .55s, .55s, 0s;
}
#physarum-note .enter:hover { color: #e8c97a; }
@media (max-width: 640px) {
  #physarum-note .hero { right: 22px; left: 22px; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  #physarum-note .hero > * { transition: none !important; }
}
</style>
</head>
<body>
<canvas id="physarum" aria-hidden="true"></canvas>
<div id="note">Morphogenesis · Physarum field（来源：Bewelge/Physarum-WebGL, MIT）</div>
<div id="physarum-note">
  <div class="shade" aria-hidden="true"></div>
  <div class="hero">
    <p class="eyebrow">physarum polycephalum · swarm field</p>
    <h1 class="title">Morphogenesis</h1>
    <div class="rule"></div>
    <p class="tagline">decentralized Agent swarm</p>
    <a class="enter" href="./index.html">enter observatory ↗</a>
  </div>
</div>
<script>

/* ===== shaders (GLSL ES 3.00) ===== */
// GLSL sources for the Physarum WebGL2 simulation.
//
// Adapted from Bewelge/Physarum-WebGL (MIT License, Copyright (c) 2021-2022
// Benjamin Welge), commit e621c3ecb60c5c8a4d1b3446c7b389b083ea1908,
// src/js/Shaders/*.js — which itself credits nicoptere/physarum for the
// ping-pong / diffuse-decay shader logic. Ported from GLSL ES 1.00 (Three.js
// ShaderMaterial) to raw GLSL ES 3.00.
// Full license text: viz/static/licenses/physarum/Physarum-WebGL.LICENSE.MIT.txt

// Fullscreen triangle. `position` is a vec2 in clip space.
const PASS_THROUGH_VERTEX = `#version 300 es
in vec2 position;
out vec2 vUv;
void main() {
    vUv = position * 0.5 + 0.5;
    gl_Position = vec4(position, 0.0, 1.0);
}
`;

// Agent update pass. One fragment per particle on the sim grid; rg = position
// (centered coords, y up), b = heading, a = species. Sensor/turn structure
// follows UpdateDotsFragment.js of the reference. No pointer input is used.
const UPDATE_AGENTS_FRAGMENT = `#version 300 es
precision highp float;

uniform sampler2D inputTexture;   // previous agent states (sim grid)
uniform sampler2D trailTexture;   // aggregated pheromone trail (view sized)
uniform sampler2D pointsTexture;  // occupied pixels this frame (view sized)

uniform vec2 resolution;          // view (trail) resolution in px

uniform vec3 moveSpeed;
uniform vec3 rotationAngle;
uniform vec3 sensorDistance;
uniform vec3 sensorAngle;
uniform vec3 attract0;
uniform vec3 attract1;
uniform vec3 attract2;

out vec4 outColor;

const float PI  = 3.14159265358979323846264;
const float PI2 = PI * 2.0;

float sampleTrail(vec2 pos, float team) {
    vec3 attract = attract0;
    if (team == 1.0) {
        attract = attract1;
    } else if (team == 2.0) {
        attract = attract2;
    }
    float val = 0.0;
    const float searchArea = 1.0;
    vec2 uv = pos / resolution + 0.5;
    for (float i = 0.0; i < searchArea * 2.0 + 1.0; i++) {
        for (float j = 0.0; j < searchArea * 2.0 + 1.0; j++) {
            vec3 pixel = texture(trailTexture, uv + vec2(i - searchArea, j - searchArea) / resolution).rgb;
            val += dot(pixel, attract) * (1.0 / pow(2.0 * searchArea + 1.0, 2.0));
        }
    }
    return val;
}

float occupancy(vec2 pos) {
    vec3 pixel = texture(pointsTexture, pos / resolution + 0.5).rgb;
    return pixel.r + pixel.g + pixel.b;
}

vec2 wrapPos(vec2 pos) {
    return fract((pos + resolution * 0.5) / resolution) * resolution - resolution * 0.5;
}

void main() {
    vec4 data = texelFetch(inputTexture, ivec2(gl_FragCoord.xy), 0);
    vec2 position = data.xy;
    float direction = data.z;
    float team = data.w;
    int teamInt = int(team + 0.5);

    float angDif = sensorAngle[teamInt];
    float sensorDist = sensorDistance[teamInt];
    float leftAng = direction - angDif;
    float rightAng = direction + angDif;

    vec2 leftPos  = position + vec2(cos(leftAng),  sin(leftAng))  * sensorDist;
    vec2 midPos   = position + vec2(cos(direction), sin(direction)) * sensorDist;
    vec2 rightPos = position + vec2(cos(rightAng), sin(rightAng)) * sensorDist;

    float leftVal  = sampleTrail(leftPos, team);
    float midVal   = sampleTrail(midPos, team);
    float rightVal = sampleTrail(rightPos, team);

    float rotationAng = rotationAngle[teamInt];
    if (midVal > rightVal && midVal > leftVal) {
        // keep heading
    } else if (midVal < rightVal && midVal < leftVal) {
        direction += (0.5 - floor(fract(sin(dot(position + gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) + 0.5)) * rotationAng;
    } else if (rightVal > midVal && rightVal > leftVal) {
        direction += rotationAng;
    } else if (leftVal > midVal && leftVal > rightVal) {
        direction -= rotationAng;
    }

    float speed = moveSpeed[teamInt];

    vec2 newPosition = position + vec2(cos(direction), sin(direction)) * speed;

    // One agent per pixel: hold position and turn away when occupied.
    bool blocked = occupancy(newPosition) > 0.0;
    if (blocked) {
        newPosition = position;
        direction += PI2 / 4.0;
    }

    newPosition = wrapPos(newPosition);

    outColor = vec4(newPosition, direction, team);
}
`;

// Points pass: draws every agent as a 1-3 px point into the view-sized
// occupancy texture; channel encodes species. Structure follows
// RenderDotsVertex.js / RenderDotsFragment.js of the reference.
const RENDER_POINTS_VERTEX = `#version 300 es
in vec2 uv; // per-agent lookup into the state texture
uniform sampler2D positionTexture;
uniform vec2 resolution;
uniform vec3 dotSizes;
out float team;
void main() {
    vec4 data = texture(positionTexture, uv);
    gl_Position = vec4(data.xy / (resolution * 0.5), 0.0, 1.0);
    team = data.w;
    gl_PointSize = dotSizes[int(data.w + 0.5)];
}
`;

const RENDER_POINTS_FRAGMENT = `#version 300 es
precision highp float;
in float team;
out vec4 outColor;
void main() {
    vec3 c = team < 0.5 ? vec3(1.0, 0.0, 0.0) : team < 1.5 ? vec3(0.0, 1.0, 0.0) : vec3(0.0, 0.0, 1.0);
    outColor = vec4(c, 1.0);
}
`;

// Diffuse + decay pass for the trail map, plus fresh agent points.
// Port of DiffuseDecayFragment.js (itself adapted from nicoptere/physarum).
const DIFFUSE_DECAY_FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D points;
uniform sampler2D inputTexture;
uniform vec2 resolution;
uniform float decay;
in vec2 vUv;
out vec4 outColor;
void main() {
    vec3 pixelPoint = texture(points, vUv).rgb;

    vec3 col = vec3(0.0);
    const float dim = 1.0;
    float weight = 1.0 / pow(2.0 * dim + 1.0, 2.0);
    for (float i = -dim; i <= dim; i++) {
        for (float j = -dim; j <= dim; j++) {
            col += texture(inputTexture, (gl_FragCoord.xy + vec2(i, j)) / resolution).rgb * weight;
        }
    }

    outColor = vec4(clamp(col * decay + pixelPoint, 0.0, 1.0), 1.0);
}
`;

// Final composite to the canvas. Adapted from FinalRenderFragment.js: species
// channels map to the Morphogenesis palette over the fixed page background.
const DISPLAY_FRAGMENT = `#version 300 es
precision highp float;
uniform sampler2D diffuseTexture;
uniform sampler2D pointsTexture;
uniform vec3 col0;
uniform vec3 col1;
uniform vec3 col2;
uniform vec3 bgColor;
uniform float trailOpacity;
uniform float dotOpacity;
in vec2 vUv;
out vec4 outColor;
void main() {
    vec3 trail = texture(diffuseTexture, vUv).rgb;
    vec3 dots = texture(pointsTexture, vUv).rgb;
    vec3 mixed = trail * trailOpacity + dots * dotOpacity;
    vec3 col = mixed.r * col0 + mixed.g * col1 + mixed.b * col2;
    col = bgColor + col / (1.0 + col * 0.8);
    outColor = vec4(col, 1.0);
}
`;

/* ===== simulation engine ===== */
// Raw WebGL2 Physarum (slime mold) simulation engine, framework-free.
//
// Rendering pipeline adapted from Bewelge/Physarum-WebGL (MIT License,
// Copyright (c) 2021-2022 Benjamin Welge), commit
// e621c3ecb60c5c8a4d1b3446c7b389b083ea1908 (src/js/physarumRender.js,
// PingPongShader.js, Shader.js), re-implemented without Three.js so the
// component carries no new runtime dependency. Ping-pong float textures,
// agent update -> points -> diffuse/decay -> display passes are preserved,
// as are branching (3-species sensor steering), aggregation (occupancy
// displacement) and trails (diffuse/decay). HiDPI sizing, visibility pause
// and disposal are new for Morphogenesis. Pointer input is intentionally absent.
// License text: viz/static/licenses/physarum/Physarum-WebGL.LICENSE.MIT.txt

class PhysarumUnavailable extends Error {
  constructor(reason, message) {
    super(message);
    this.name = 'PhysarumUnavailable';
    this.reason = reason;
  }
}

// Species parameters, fixed for determinism (the reference randomizes per
// page load; ranges mirror its randomizeSettings()).
const SETTINGS = {
  decay: 0.95,
  trailOpacity: 1.0,
  dotOpacity: 0.2,
  dotSizes: [1, 1, 1],
  moveSpeed: [1.7, 2.1, 1.4],
  sensorDistance: [6.0, 9.0, 4.5],
  rotationAngle: [0.5, 0.65, 0.4],
  sensorAngle: [0.5, 0.7, 0.45],
  // Weak cross-species repulsion, strong self-attraction: keeps the three
  // colonies branching instead of merging into one mass.
  attract0: [1.0, -0.15, -0.15],
  attract1: [-0.15, 1.0, -0.15],
  attract2: [-0.15, -0.15, 1.0],
  // Three warm shades retain the original species channels and brightness
  // balance while making the ambient plasmodium consistently yellow.
  col0: [0xf5 / 255, 0xd5 / 255, 0x47 / 255], // slime yellow #f5d547
  col1: [(0xd8 / 255) * 0.75, (0xa8 / 255) * 0.75, (0x33 / 255) * 0.75], // muted amber
  col2: [(0xc7 / 255) * 0.8, (0x8c / 255) * 0.8, (0x25 / 255) * 0.8], // deep amber
  bgColor: [0, 0, 0], // shared Christmas-derived black stage; simulation unchanged
};

const rndFloat = (min, max) => min + (max - min) * Math.random();
const rndInt = (min, max) => Math.round(min + (max - min) * Math.random());

function compileShader(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(shader);
    gl.deleteShader(shader);
    throw new PhysarumUnavailable('shader-compile', log || 'shader compile failed');
  }
  return shader;
}

function createProgram(gl, vertexSource, fragmentSource) {
  const program = gl.createProgram();
  gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    const log = gl.getProgramInfoLog(program);
    gl.deleteProgram(program);
    throw new PhysarumUnavailable('program-link', log || 'program link failed');
  }
  return program;
}

function createFloatTexture(gl, width, height, data) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, width, height, 0, gl.RGBA, gl.FLOAT, data || null);
  gl.bindTexture(gl.TEXTURE_2D, null);
  return texture;
}

function createTarget(gl, width, height, data) {
  const texture = createFloatTexture(gl, width, height, data);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if (!ok) {
    gl.deleteFramebuffer(fbo);
    gl.deleteTexture(texture);
    throw new PhysarumUnavailable('framebuffer', 'float framebuffer incomplete');
  }
  return { texture, fbo, width, height };
}

function disposeTarget(gl, target) {
  if (!target) return;
  gl.deleteFramebuffer(target.fbo);
  gl.deleteTexture(target.texture);
}

// Initial layout, ported from resetPositions() of the reference (three
// clusters at random interior points, random headings, species by cluster).
function seedAgents(grid, viewWidth, viewHeight) {
  const count = grid * grid;
  const data = new Float32Array(count * 4);
  const marg = Math.min(viewWidth, viewHeight) * 0.2;
  const clusters = [0, 1, 2].map(() => ({
    x: rndFloat(marg, Math.max(marg + 1, viewWidth - marg)) - viewWidth * 0.5,
    y: rndFloat(marg, Math.max(marg + 1, viewHeight - marg)) - viewHeight * 0.5,
  }));
  for (let i = 0; i < count; i++) {
    const id = i * 4;
    const team = Math.min(2, Math.floor((i / count) * 3));
    const base = clusters[team];
    const ang = rndFloat(0, Math.PI * 2);
    // Spread seeds wide enough that no cluster starts as a saturated blob.
    const dis = rndFloat(30, 90) + team * 50 + rndFloat(0, 40);
    data[id] = base.x + dis * Math.cos(ang);
    data[id + 1] = base.y + dis * Math.sin(ang);
    data[id + 2] = ang;
    data[id + 3] = team;
  }
  return data;
}

class PhysarumSim {
  // grid: sim texture is grid x grid agents. maxDpr caps devicePixelRatio.
  constructor(canvas, { grid = 256, maxDpr = 2 } = {}) {
    this.canvas = canvas;
    this.grid = grid;
    this.maxDpr = maxDpr;
    this.settings = { ...SETTINGS };
    this.time = 0;
    this.running = false;
    this.disposed = false;
    this.food = { x: 0, y: 0, strength: 0, target: 0 };
    this.viewWidth = 0;
    this.viewHeight = 0;
    this.avgFrameMs = 0;
    this._lastTs = 0;
    this._raf = 0;
    this._frame = this._frame.bind(this);

    const gl = canvas.getContext('webgl2', {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: false,
      powerPreference: 'high-performance',
    });
    if (!gl) {
      throw new PhysarumUnavailable('webgl2-unavailable', 'WebGL2 context could not be created');
    }
    if (!gl.getExtension('EXT_color_buffer_float')) {
      throw new PhysarumUnavailable('float-buffer-unavailable', 'EXT_color_buffer_float missing');
    }
    this.gl = gl;

    this._buildPrograms();
    this._buildGeometry();
    // Agent state textures are created lazily on the first resize(), once the
    // real view size is known, so clusters seed inside the actual viewport.

    this._onContextLost = (ev) => {
      ev.preventDefault();
      this.stop();
      this.disposed = true;
      if (this.onContextLost) this.onContextLost();
    };
    canvas.addEventListener('webglcontextlost', this._onContextLost);
  }

  _buildPrograms() {
    const gl = this.gl;
    this.updateProgram = createProgram(gl, PASS_THROUGH_VERTEX, UPDATE_AGENTS_FRAGMENT);
    this.pointsProgram = createProgram(gl, RENDER_POINTS_VERTEX, RENDER_POINTS_FRAGMENT);
    this.diffuseProgram = createProgram(gl, PASS_THROUGH_VERTEX, DIFFUSE_DECAY_FRAGMENT);
    this.displayProgram = createProgram(gl, PASS_THROUGH_VERTEX, DISPLAY_FRAGMENT);
    this.uniforms = {};
    for (const [name, program] of [
      ['update', this.updateProgram],
      ['points', this.pointsProgram],
      ['diffuse', this.diffuseProgram],
      ['display', this.displayProgram],
    ]) {
      const map = {};
      const n = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(program, i);
        map[info.name] = gl.getUniformLocation(program, info.name);
      }
      this.uniforms[name] = map;
    }
  }

  _buildGeometry() {
    const gl = this.gl;
    // Fullscreen triangle.
    this.quadVao = gl.createVertexArray();
    gl.bindVertexArray(this.quadVao);
    const quadBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    for (const program of [this.updateProgram, this.diffuseProgram, this.displayProgram]) {
      const loc = gl.getAttribLocation(program, 'position');
      if (loc >= 0) {
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      }
    }
    gl.bindVertexArray(null);

    // Agent points: only a uv lookup attribute into the state texture.
    const count = this.grid * this.grid;
    const uvs = new Float32Array(count * 2);
    for (let i = 0; i < count; i++) {
      uvs[i * 2] = ((i % this.grid) + 0.5) / this.grid;
      uvs[i * 2 + 1] = (Math.floor(i / this.grid) + 0.5) / this.grid;
    }
    this.pointsVao = gl.createVertexArray();
    gl.bindVertexArray(this.pointsVao);
    const uvBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, uvs, gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(this.pointsProgram, 'uv');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
    gl.bindBuffer(gl.ARRAY_BUFFER, null);
    this.agentCount = count;
  }

  _buildAgentTargets() {
    const gl = this.gl;
    const data = seedAgents(this.grid, Math.max(this.viewWidth, 2), Math.max(this.viewHeight, 2));
    this.agentRead = createTarget(gl, this.grid, this.grid, data);
    this.agentWrite = createTarget(gl, this.grid, this.grid, null);
  }

  // width/height are CSS pixels of the container.
  resize(cssWidth, cssHeight) {
    if (this.disposed || cssWidth < 2 || cssHeight < 2) return;
    const dpr = Math.min(window.devicePixelRatio || 1, this.maxDpr);
    const w = Math.max(2, Math.round(cssWidth * dpr));
    const h = Math.max(2, Math.round(cssHeight * dpr));
    if (w === this.viewWidth && h === this.viewHeight) return;
    this.viewWidth = w;
    this.viewHeight = h;
    this.canvas.width = w;
    this.canvas.height = h;
    const gl = this.gl;
    if (!this.agentRead) {
      this._buildAgentTargets();
    }
    disposeTarget(gl, this.trailRead);
    disposeTarget(gl, this.trailWrite);
    disposeTarget(gl, this.pointsTarget);
    this.trailRead = createTarget(gl, w, h, null);
    this.trailWrite = createTarget(gl, w, h, null);
    this.pointsTarget = createTarget(gl, w, h, null);
  }

  getAverageFrameMs() {
    return this.avgFrameMs;
  }

  // Read-only agent statistics (integration tests; also handy for tuning).
  // Returns null when float readback is unsupported.
  getAgentStats() {
    if (this.disposed || !this.agentRead) return null;
    const gl = this.gl;
    const count = this.grid * this.grid;
    const buf = new Float32Array(count * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.agentRead.fbo);
    try {
      gl.readPixels(0, 0, this.grid, this.grid, gl.RGBA, gl.FLOAT, buf);
    } catch (err) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return null;
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let cx = 0;
    let cy = 0;
    let foodDist = 0;
    for (let i = 0; i < count; i++) {
      const x = buf[i * 4];
      const y = buf[i * 4 + 1];
      cx += x;
      cy += y;
      foodDist += Math.hypot(x - this.food.x, y - this.food.y);
    }
    return {
      centroid: { x: cx / count, y: cy / count },
      meanFoodDistance: foodDist / count,
    };
  }

  start() {
    if (this.running || this.disposed || !this.trailRead || !this.agentRead) return;
    this.running = true;
    this._lastTs = 0;
    this._raf = requestAnimationFrame(this._frame);
  }

  stop() {
    this.running = false;
    if (this._raf) {
      cancelAnimationFrame(this._raf);
      this._raf = 0;
    }
  }

  _frame(ts) {
    if (!this.running) return;
    this._raf = requestAnimationFrame(this._frame);
    if (this._lastTs) {
      const dt = Math.min(100, ts - this._lastTs);
      this.avgFrameMs = this.avgFrameMs ? this.avgFrameMs * 0.95 + dt * 0.05 : dt;
    }
    this._lastTs = ts;
    this._step();
  }

  _bindTexture(unit, texture, location) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.uniform1i(location, unit);
  }

  _step() {
    const gl = this.gl;
    const s = this.settings;
    const w = this.viewWidth;
    const h = this.viewHeight;
    this.time += 1;

    // 1. Agent update (ping-pong on the sim grid).
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.agentWrite.fbo);
    gl.viewport(0, 0, this.grid, this.grid);
    gl.useProgram(this.updateProgram);
    gl.bindVertexArray(this.quadVao);
    const u = this.uniforms.update;
    this._bindTexture(0, this.agentRead.texture, u.inputTexture);
    this._bindTexture(1, this.trailRead.texture, u.trailTexture);
    this._bindTexture(2, this.pointsTarget.texture, u.pointsTexture);
    gl.uniform2f(u.resolution, w, h);
    gl.uniform3fv(u.moveSpeed, s.moveSpeed);
    gl.uniform3fv(u.rotationAngle, s.rotationAngle);
    gl.uniform3fv(u.sensorDistance, s.sensorDistance);
    gl.uniform3fv(u.sensorAngle, s.sensorAngle);
    gl.uniform3fv(u.attract0, s.attract0);
    gl.uniform3fv(u.attract1, s.attract1);
    gl.uniform3fv(u.attract2, s.attract2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    [this.agentRead, this.agentWrite] = [this.agentWrite, this.agentRead];

    // 2. Points pass: draw agents into the occupancy texture.
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.pointsTarget.fbo);
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.useProgram(this.pointsProgram);
    gl.bindVertexArray(this.pointsVao);
    const p = this.uniforms.points;
    this._bindTexture(0, this.agentRead.texture, p.positionTexture);
    gl.uniform2f(p.resolution, w, h);
    gl.uniform3fv(p.dotSizes, s.dotSizes);
    gl.drawArrays(gl.POINTS, 0, this.agentCount);

    // 3. Diffuse + decay the trail, adding fresh points (ping-pong).
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.trailWrite.fbo);
    gl.viewport(0, 0, w, h);
    gl.useProgram(this.diffuseProgram);
    gl.bindVertexArray(this.quadVao);
    const d = this.uniforms.diffuse;
    this._bindTexture(0, this.pointsTarget.texture, d.points);
    this._bindTexture(1, this.trailRead.texture, d.inputTexture);
    gl.uniform2f(d.resolution, w, h);
    gl.uniform1f(d.decay, s.decay);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    [this.trailRead, this.trailWrite] = [this.trailWrite, this.trailRead];

    // 4. Composite to the canvas.
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.useProgram(this.displayProgram);
    gl.bindVertexArray(this.quadVao);
    const f = this.uniforms.display;
    this._bindTexture(0, this.trailRead.texture, f.diffuseTexture);
    this._bindTexture(1, this.pointsTarget.texture, f.pointsTexture);
    gl.uniform3fv(f.col0, s.col0);
    gl.uniform3fv(f.col1, s.col1);
    gl.uniform3fv(f.col2, s.col2);
    gl.uniform3fv(f.bgColor, s.bgColor);
    gl.uniform1f(f.trailOpacity, s.trailOpacity);
    gl.uniform1f(f.dotOpacity, s.dotOpacity);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindVertexArray(null);
  }

  dispose() {
    if (this.disposed) return;
    this.stop();
    this.disposed = true;
    const gl = this.gl;
    this.canvas.removeEventListener('webglcontextlost', this._onContextLost);
    disposeTarget(gl, this.agentRead);
    disposeTarget(gl, this.agentWrite);
    disposeTarget(gl, this.trailRead);
    disposeTarget(gl, this.trailWrite);
    disposeTarget(gl, this.pointsTarget);
    gl.deleteVertexArray(this.quadVao);
    gl.deleteVertexArray(this.pointsVao);
    for (const program of [this.updateProgram, this.pointsProgram, this.diffuseProgram, this.displayProgram]) {
      gl.deleteProgram(program);
    }
    const lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
  }
}

const QUALITY_LEVELS = [
  { grid: 256, maxDpr: 2 }, // desktop default
  { grid: 128, maxDpr: 1 }, // degraded / touch default
];

/* ===== bootstrap ===== */
(function () {
  var canvas = document.getElementById('physarum');
  var sim;
  try {
    sim = new PhysarumSim(canvas, { grid: 256, maxDpr: 2 });
  } catch (err) {
    canvas.remove();
    var note = document.getElementById('note');
    if (note) note.textContent = '黏菌场已降级：WebGL2 不可用（' + (err && err.reason || 'init-failure') + '）';
    return;
  }
  var applySize = function () { sim.resize(window.innerWidth, window.innerHeight); };
  applySize();
  window.addEventListener('resize', applySize);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) sim.stop(); else sim.start();
  });
  sim.start();
  setTimeout(function () {
    var o = document.getElementById('physarum-note');
    if (o) o.classList.add('revealed');
  }, 1600);
})();


</script>
