worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Log paths, not browser query strings or forwarded credentials.
    log_format readonly '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout readonly;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    large_client_header_buffers 2 8k;
    keepalive_timeout 15s;
    send_timeout 10s;
    limit_req_zone $binary_remote_addr zone=static:1m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=dashboard:1m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=evomap:1m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    limit_req_status 429;
    limit_conn_status 429;
    upstream dashboard_api { server api:7500; }
    server {
        listen 8080;
        root /srv/morphogenesis;
        autoindex off;
        disable_symlinks on;
        limit_conn connections 8;
        limit_req zone=static burst=40 nodelay;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-cache" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        if ($http_content_length !~ ^(0)?$) { return 413; }
        if ($http_transfer_encoding != "") { return 413; }

        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location = /app.js { try_files $uri =404; }
        location = /style.css { try_files $uri =404; }
        location = /assets/finals-shell.js { try_files $uri =404; }
        location = /assets/finals-shell.css { try_files $uri =404; }
        location = /vendor/echarts.min.js { try_files $uri =404; }
        # F owns the files. Missing fonts remain 404 until its commit is merged.
        location = /fonts/Jost-latin.woff2 { try_files $uri =404; }
        location = /fonts/InterVariable.woff2 { try_files $uri =404; }
        location ~ ^/licenses/[A-Za-z0-9_./-]+\.(txt|md)$ { try_files $uri =404; }
        location = /api/dashboard {
            limit_req zone=dashboard burst=10 nodelay;
            include /etc/nginx/morphogenesis-proxy.conf;
        }
        location = /api/swarm {
            limit_req zone=dashboard burst=10 nodelay;
            include /etc/nginx/morphogenesis-proxy.conf;
        }
        location = /api/evomap {
            limit_req zone=evomap burst=3 nodelay;
            include /etc/nginx/morphogenesis-proxy.conf;
        }
        location = /api/evomap/asset {
            limit_req zone=evomap burst=3 nodelay;
            include /etc/nginx/morphogenesis-proxy.conf;
        }
        location / { return 404; }
    }
}
