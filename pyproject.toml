[tool.poetry]
name = "morphogenesis"
version = "0.1.0"
description = "An independently verifiable, fixed-size agent swarm prototype"
authors = ["Morphogenesis contributors"]
license = "Apache-2.0"
readme = "README.md"
packages = [
  {include = "contracts"}, {include = "persistence"}, {include = "bootstrap"},
  {include = "bridge_node"}, {include = "hub_client"}, {include = "orca_provision"},
  {include = "orchestration"}, {include = "topology"}, {include = "metabolism"},
  {include = "mocks"}, {include = "viz"},
  {include = "swarm"}, {include = "local_assets"},
]
include = [
  {path = "bootstrap/fixtures/*.txt", format = ["sdist", "wheel"]},
  {path = "bridge_node/asset_bridge.mjs", format = ["sdist", "wheel"]},
  {path = "viz/static/**", format = ["sdist", "wheel"]},
  {path = "demo/**", format = ["sdist", "wheel"]},
  {path = "THIRD_PARTY_NOTICES.md", format = ["sdist", "wheel"]},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pydantic = ">=2.11,<3"
sqlmodel = ">=0.0.24,<0.1"
langgraph = ">=1.0,<2"
langgraph-checkpoint-sqlite = ">=3.0,<4"
httpx = ">=0.28,<0.29"
mcp = ">=1.20,<2"
faiss-cpu = ">=1.12,<2"
numpy = ">=2.0,<3"
scikit-learn = ">=1.7,<2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
mypy = ">=1.15,<2"
build = ">=1.2,<2"

[tool.poetry.scripts]
morphogenesis = "bootstrap.cli:main"
morphogenesis-swarm = "swarm.cli:main"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["contracts", "persistence", "bootstrap", "tools"]
exclude = ["bootstrap/fixtures"]

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*"]
ignore_missing_imports = true
